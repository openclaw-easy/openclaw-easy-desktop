  matrix-js-sdk@42.3.0: openclaw/patches/matrix-js-sdk@42.3.0.patch
  '@novnc/novnc@1.7.0': openclaw/patches/@novnc__novnc@1.7.0.patch
  vitest@5.0.0: openclaw/patches/vitest@5.0.0.patch
