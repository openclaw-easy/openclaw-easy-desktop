# pnpm honours workspace settings only at the workspace root, and the
# vendored OpenClaw core lives in a subdirectory — so the core settings are
# re-copied here on every refresh with package globs and every path-valued
# setting (patchedDependencies) re-rooted under openclaw/.
#
# Regenerated by the vendored-core refresh; see OSS_PORTING_PLAYBOOK.md §10.
packages:
  - apps/*
  - packages/*
  - openclaw
  - openclaw/ui
  - openclaw/packages/*
  - openclaw/extensions/*
  - openclaw/examples/*
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - acpx@0.17.1
  - '@openclaw/fs-safe@0.12.0'
  - '@openclaw/fs-safe-darwin-arm64@0.12.0'
  - '@openclaw/fs-safe-darwin-x64@0.12.0'
  - '@openclaw/fs-safe-linux-arm64-gnu@0.12.0'
  - '@openclaw/fs-safe-linux-arm64-musl@0.12.0'
  - '@openclaw/fs-safe-linux-x64-gnu@0.12.0'
  - '@openclaw/fs-safe-linux-x64-musl@0.12.0'
  - '@openclaw/fs-safe-win32-x64-msvc@0.12.0'
  - zod@4.6.2
  - proxy-addr@2.0.8
  - markdown-it@15.0.2
  - '@openclaw/crabline@0.1.27'
  - libopus-wasm@0.4.0
  - '@openclaw/proxyline@0.3.12'
  - '@openai/codex'
  - '@openai/codex-*'
  - '@openclaw/fs-safe@0.16.0'
  - '@openclaw/fs-safe-darwin-arm64@0.16.0'
  - '@openclaw/fs-safe-darwin-x64@0.16.0'
  - '@openclaw/fs-safe-linux-arm64-gnu@0.16.0'
  - '@openclaw/fs-safe-linux-arm64-musl@0.16.0'
  - '@openclaw/fs-safe-linux-x64-gnu@0.16.0'
  - '@openclaw/fs-safe-linux-x64-musl@0.16.0'
  - '@openclaw/fs-safe-win32-x64-msvc@0.16.0'
  - jszip@3.10.2
  - nodemailer@10.0.8
nodeLinker: isolated
verifyDepsBeforeRun: false
blockExoticSubdeps: true
overrides:
  '@lancedb/lancedb>@huggingface/transformers': '-'
  baileys>sharp: '-'
  '@agentclientprotocol/codex-acp@1.10.0>@openai/codex': 0.154.0
  '@codemirror/commands@6.11.0>@codemirror/view': 6.43.11
  '@anthropic-ai/sdk': 0.124.0
  '@anthropic-ai/vertex-sdk@0.19.7>google-auth-library': 11.0.2
  '@opentelemetry/core': 2.11.0
  '@opentelemetry/propagator-jaeger': 2.11.0
  '@aws-sdk/core': 3.977.9
  '@aws-sdk/credential-provider-node': 3.972.82
  '@aws-sdk/xml-builder': 3.972.40
  '@hono/node-server': 2.1.1
  axios: 1.20.0
  fast-uri: 4.1.4
  follow-redirects: 1.16.0
  defu: 6.1.7
  fast-xml-parser: 5.11.1
  request: npm:@cypress/request@4.0.1
  request-promise: npm:@cypress/request-promise@5.0.0
  basic-ftp: 6.2.1
  brace-expansion: 5.0.9
  file-type: 22.0.2
  form-data: 4.0.6
  werift-ice@0.2.2>ip: npm:neoip@3.1.0
  ip-address: 10.7.0
  mailauth@5.0.3>nodemailer: 10.0.8
  mailauth@5.0.3>undici: 8.10.2
  mailparser@3.9.23>nodemailer: 10.0.8
  minimatch: 10.2.6
  path-to-regexp: 8.4.2
  proxy-addr: 2.0.8
  qs: 6.16.0
  node-domexception: npm:@nolyfill/domexception@1.0.28
  typebox: 1.3.30
  tar: 7.5.22
  tough-cookie: 6.0.2
  tsdown>rolldown-plugin-dts: 0.28.5
  zca-js@2.1.2>tough-cookie: 6.0.2
  yauzl: 3.4.0
  protobufjs: 8.8.0
  uuid: 14.0.2
allowBuilds:
  electron: true
  onnxruntime-node: false
  '@google/genai': true
  '@lydell/node-pty': true
  '@matrix-org/matrix-sdk-crypto-nodejs': true
  '@tloncorp/api': true
  '@tloncorp/tlon-skill': true
  baileys: true
  authenticate-pam: true
  '@discordjs/opus': false
  esbuild: true
  koffi: false
  protobufjs: true
  tree-sitter-bash: false
  openclaw: true
  '@openclaw/proxyline': true
  clawpdf: true
  '@openclaw/crabline': true
  rastermill: true
  node-pty: true
packageExtensions:
