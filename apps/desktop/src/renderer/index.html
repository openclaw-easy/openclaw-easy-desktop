<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://api.fontshare.com https://cdn.fontshare.com; font-src 'self' https://cdn.fontshare.com data:;" />
    <!--
      Openclaw.ai brand fonts: Clash Display for headings + Satoshi for
      body. Loaded from Fontshare to match the marketing site exactly.
      Falls back to Inter Variable (bundled) when offline or while the
      remote sheet is loading, so first paint never FOITs.
    -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=satoshi@400,500,700,900&display=swap"
    />
    <title>Openclaw Easy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
