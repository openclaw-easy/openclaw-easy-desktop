name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build desktop
        working-directory: ./apps/desktop
        run: pnpm build

      - name: Unit tests
        working-directory: ./apps/desktop
        run: pnpm vitest run
