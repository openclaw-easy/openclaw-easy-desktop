name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build OpenClaw core
        working-directory: ./openclaw
        run: pnpm build:docker
        env:
          OPENCLAW_A2UI_SKIP_MISSING: '1'

      - name: Prepare installer bundle
        shell: bash
        working-directory: ./apps/desktop
        run: bash scripts/prepare-bundle.sh

      - name: Build desktop app
        working-directory: ./apps/desktop
        run: pnpm build

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        working-directory: ./apps/desktop
        run: npx electron-builder --win --publish always --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: ./apps/desktop
        run: npx electron-builder --mac dmg --arm64 --x64 --publish always --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        working-directory: ./apps/desktop
        run: npx electron-builder --linux --publish always --config electron-builder.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            apps/desktop/dist-installers/*.dmg
            apps/desktop/dist-installers/*.exe
            apps/desktop/dist-installers/*.AppImage
